name: Build Wirex Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: r26b
          local-cache: true

      - name: Extract Project Zip
        run: |
          unzip -q hack.zip -d extracted_project
          ls -la extracted_project

      - name: Compile Library
        run: |
          # Знаходимо шлях до папки з проєктом після розпакування
          PROJECT_DIR=$(find extracted_project -type d -name "ImGui" -exec dirname {} \;)
          echo "Проєкт знайдено в: $PROJECT_DIR"
          
          $ANDROID_SDK_ROOT/ndk/26.b*/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
            -shared -fPIC -std=c++17 \
            "$PROJECT_DIR/Main.cpp" \
            "$PROJECT_DIR/ImGui/imgui.cpp" \
            "$PROJECT_DIR/ImGui/imgui_draw.cpp" \
            "$PROJECT_DIR/ImGui/imgui_tables.cpp" \
            "$PROJECT_DIR/ImGui/imgui_widgets.cpp" \
            "$PROJECT_DIR/ImGui/backends/imgui_impl_android.cpp" \
            "$PROJECT_DIR/ImGui/backends/imgui_impl_opengl3.cpp" \
            -I"$PROJECT_DIR" \
            -I"$PROJECT_DIR/ImGui" \
            -I"$PROJECT_DIR/Includes" \
            -L"$PROJECT_DIR/libraries/arm64-v8a" -ldobby \
            -llog -lGLESv2 -lEGL \
            -o libwirex.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirex-library
          path: libwirex.so
