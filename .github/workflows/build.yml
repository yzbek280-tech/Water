name: Build WaterHack Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Setup Android NDK
        run: |
          echo "Загрузка NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          echo "Распаковка NDK..."
          unzip -q android-ndk-r26b-linux.zip
          echo "NDK готов!"

      - name: Extract Project Zip
        run: |
          unzip -q hack.zip -d extracted_project
          echo "=== СТРУКТУРА ПРОЕКТУ ==="
          find extracted_project -maxdepth 3
          echo "========================"

      - name: Compile Library
        run: |
          PROJECT_DIR=$(find extracted_project -type d -name "ImGui" -exec dirname {} \;)
          echo "Проект найден в: $PROJECT_DIR"
          
          # Створюємо сумісність шляхів нижнього/верхнього регістру
          if [ -d "$PROJECT_DIR/Includes" ] && [ ! -d "$PROJECT_DIR/includes" ]; then
            ln -s Includes "$PROJECT_DIR/includes"
          elif [ -d "$PROJECT_DIR/includes" ] && [ ! -d "$PROJECT_DIR/Includes" ]; then
            ln -s includes "$PROJECT_DIR/Includes"
          fi

          NDK_PATH=$PWD/android-ndk-r26b
          
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
            -shared -fPIC -std=c++17 \
            "$PROJECT_DIR/Main.cpp" \
            "$PROJECT_DIR/ImGui/imgui.cpp" \
            "$PROJECT_DIR/ImGui/imgui_draw.cpp" \
            "$PROJECT_DIR/ImGui/imgui_tables.cpp" \
            "$PROJECT_DIR/ImGui/imgui_widgets.cpp" \
            "$PROJECT_DIR/ImGui/backends/imgui_impl_android.cpp" \
            "$PROJECT_DIR/ImGui/backends/imgui_impl_opengl3.cpp" \
            -I"$PROJECT_DIR" \
            -I"$PROJECT_DIR/ImGui" \
            -I"$PROJECT_DIR/Includes" \
            -I"$PROJECT_DIR/includes" \
            -L"$PROJECT_DIR/libraries/arm64-v8a" -ldobby \
            -llog -lGLESv2 -lEGL \
            -o libwaterhack.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waterhack-library
          path: libwaterhack.so
